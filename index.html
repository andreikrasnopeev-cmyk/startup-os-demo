/* =========================================================================
   ФАБРИКА ГИПОТЕЗ — Design Tokens
   Colors + Typography foundations for the Hypothesis Factory brand.
   Source of truth: product-growth.ru + brand teaser deck.

   FONT NOTE: The live site uses a proprietary geometric grotesque
   (Gilroy / TT-Norms family). We substitute MANROPE (Google Fonts, full
   Cyrillic) as the nearest free match. Swap the @import + --font-* vars
   if the real font files are supplied.
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  /* ---- Brand core (given) ---------------------------------------------- */
  --fg-ink:        #1E1E1E;   /* primary dark — page background on dark UI   */
  --fg-paper:      #F7F7F7;   /* off-white — text on dark, bg on light UI    */
  --accent:        #D7FC4E;   /* signature lime — sparks, CTAs, highlights   */

  /* ---- Dark surface ramp (default brand context) ----------------------- */
  --bg-0:          #1A1A1A;   /* deepest — full-bleed page                   */
  --bg-1:          #1E1E1E;   /* base background                             */
  --bg-2:          #262626;   /* raised surface / section                    */
  --bg-3:          #2E2E2E;   /* card                                        */
  --bg-4:          #383838;   /* hover / input field                         */

  /* ---- Text on dark ---------------------------------------------------- */
  --text-1:        #F7F7F7;   /* primary                                     */
  --text-2:        #A7A7A7;   /* secondary / captions                        */
  --text-3:        #6E6E6E;   /* tertiary / disabled                         */
  --text-on-lime:  #1E1E1E;   /* ink text sitting on the lime accent         */

  /* ---- Light surface ramp (cards, alt sections) ------------------------ */
  --paper-0:       #FFFFFF;
  --paper-1:       #F7F7F7;
  --paper-2:       #EFEFEF;
  --paper-3:       #E4E4E4;
  --ink-1:         #1E1E1E;   /* primary text on light                       */
  --ink-2:         #5B5B5B;   /* secondary text on light                     */
  --ink-3:         #8C8C8C;   /* tertiary text on light                      */

  /* ---- Accent variants ------------------------------------------------- */
  --accent-hover:  #E4FF6B;   /* lighter lime on hover                       */
  --accent-press:  #C2E63F;   /* darker lime on press                        */
  --accent-soft:   rgba(215,252,78,0.14);  /* tint wash / glow              */
  --accent-line:   rgba(215,252,78,0.40);

  /* ---- Borders & lines ------------------------------------------------- */
  --line-on-dark:  rgba(247,247,247,0.12);
  --line-on-dark-2:rgba(247,247,247,0.22);
  --line-on-light: rgba(30,30,30,0.12);
  --line-on-light-2:rgba(30,30,30,0.20);

  /* ---- Semantic (used sparingly — brand is near-monochrome + lime) ----- */
  --positive:      #7BE08A;
  --warning:       #FFC24B;
  --negative:      #FF6B5E;
  --info:          #6FB6FF;

  /* =====================================================================
     TYPOGRAPHY
     ===================================================================== */
  --font-display:  'Manrope', system-ui, sans-serif;  /* headings, logo lockups */
  --font-body:     'Manrope', system-ui, sans-serif;  /* body, UI               */
  --font-mono:     'JetBrains Mono', ui-monospace, monospace;

  /* Type scale (px). Display sizes assume large surfaces / slides. */
  --fs-display:    clamp(48px, 7vw, 104px);  /* @kind font */
  --fs-h1:         clamp(36px, 4.5vw, 64px);  /* @kind font */
  --fs-h2:         clamp(28px, 3vw, 44px);  /* @kind font */
  --fs-h3:         clamp(22px, 2vw, 30px);  /* @kind font */
  --fs-h4:         20px;
  --fs-body-lg:    19px;
  --fs-body:       16px;
  --fs-small:      14px;
  --fs-caption:    12px;
  --fs-eyebrow:    13px;

  --lh-tight:      1.02;   /* @kind font */
  --lh-display:    1.05;   /* @kind font */
  --lh-heading:    1.12;   /* @kind font */
  --lh-body:       1.55;   /* @kind font */

  --ls-display:    -0.02em;
  --ls-heading:    -0.01em;
  --ls-eyebrow:    0.14em;   /* ALL-CAPS eyebrows / section labels          */
  --ls-caps:       0.04em;

  /* =====================================================================
     SHAPE · SHADOW · SPACE
     ===================================================================== */
  --r-xs:   6px;
  --r-sm:   10px;
  --r-md:   16px;
  --r-lg:   24px;
  --r-xl:   32px;
  --r-pill: 999px;     /* the brand "capsule" radius — used everywhere      */

  --shadow-sm:  0 1px 2px rgba(0,0,0,0.30);
  --shadow-md:  0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg:  0 24px 60px rgba(0,0,0,0.45);
  --glow-lime:  0 0 0 1px var(--accent-line), 0 8px 32px rgba(215,252,78,0.18);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --space-9: 96px; --space-10:128px;

  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);   /* @kind other */
  --ease-inout:  cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */
  --dur-fast:    140ms;   /* @kind other */
  --dur-base:    240ms;   /* @kind other */
  --dur-slow:    420ms;   /* @kind other */
}

/* =========================================================================
   SEMANTIC ELEMENT STYLES
   Apply these classes (or copy the rules) for consistent brand type.
   ========================================================================= */
.fg-display {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-display);
  line-height: var(--lh-display);
  letter-spacing: var(--ls-display);
}
.fg-h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h1); line-height: var(--lh-heading); letter-spacing: var(--ls-heading); }
.fg-h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h2); line-height: var(--lh-heading); letter-spacing: var(--ls-heading); }
.fg-h3 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h3); line-height: var(--lh-heading); }
.fg-h4 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h4); line-height: 1.2; }

/* Section labels / eyebrows are ALL-CAPS, tracked-out, often lime. */
.fg-eyebrow {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: var(--fs-eyebrow);
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
}

.fg-body    { font-family: var(--font-body); font-weight: 400; font-size: var(--fs-body);    line-height: var(--lh-body); }
.fg-body-lg { font-family: var(--font-body); font-weight: 400; font-size: var(--fs-body-lg); line-height: var(--lh-body); }
.fg-small   { font-family: var(--font-body); font-weight: 500; font-size: var(--fs-small);   line-height: 1.45; }
.fg-caption { font-family: var(--font-body); font-weight: 500; font-size: var(--fs-caption); line-height: 1.4; color: var(--text-2); }
.fg-mono    { font-family: var(--font-mono); font-weight: 400; font-size: var(--fs-small); letter-spacing: 0; }

.fg-accent  { color: var(--accent); }


:root {
  color-scheme: dark;
  --sidebar: 226px;
  --canvas: #1a1a1a;
  --nav: #1e1e1e;
  --card: #242424;
  --subtle: #202020;
  --hair: #373737;
  --muted: #a7a7a7;
  --quiet: #858585;
  --accent-ink: #242917;
  --accent-tint: #2d3320;
  --card-radius: 20px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--text-1); font: 14px/1.55 var(--font-body); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.16; letter-spacing: -.035em; overflow-wrap: anywhere; }
p, label, td { overflow-wrap: anywhere; }
h1 { font-size: clamp(35px, 4vw, 50px); font-weight: 800; }
h2 { font-size: 25px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 800; }
strong { font-weight: 800; }
::selection { background: var(--accent); color: var(--fg-ink); }
.icon { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; vertical-align: middle; }
.skip { position: fixed; z-index: 10; left: 15px; top: -100px; background: var(--bg-3); padding: 12px; }
.skip:focus { top: 10px; }
#shell { display: grid; min-height: 100vh; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
#sidebar {
  position: sticky; height: 100vh; height: 100dvh; top: 0; align-self: start; display: flex;
  flex-direction: column; gap: 24px; padding: 25px 15px 17px; background: var(--nav);
  border-right: 1px solid #333; overflow: auto;
}
.wordmark { display: flex; gap: 11px; align-items: center; padding: 0 7px; color: var(--text-1); text-decoration: none; }
.brand-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--accent); flex: 0 0 auto; }
.brand-icon img { width: 15px; height: 22px; object-fit: contain; filter: brightness(.16); }
.wordmark strong { font-size: 19px; letter-spacing: -.055em; line-height: 1.04; display: block; }
.wordmark small { color: var(--muted); display: block; margin-top: 4px; font-size: 10px; letter-spacing: .01em; }
.project-picker {
  display: flex; align-items: center; gap: 10px; border: 1px solid var(--hair); background: #252525;
  color: var(--text-1); text-align: left; width: 100%; padding: 9px 10px; border-radius: 13px;
}
.project-picker:hover { background: var(--bg-3); }
.initial { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 9px; background: #3a3c30; color: var(--accent); font-weight: 800; flex: 0 0 auto; }
.project-picker .picker-name { display: grid; gap: 1px; min-width: 0; flex: 1; }
.picker-name strong { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.picker-name small { color: var(--muted); font-size: 11px; }
.project-picker > .icon { width: 14px; color: var(--quiet); }
.nav-group { display: grid; gap: 4px; }
.nav-caption { color: var(--quiet); text-transform: uppercase; font-size: 10px; letter-spacing: .13em; font-weight: 800; margin: 0 11px 6px; }
.nav-link {
  border: 1px solid transparent; border-radius: 10px; padding: 10px 11px; display: flex; align-items: center;
  gap: 11px; background: transparent; color: #b9b9b9; font-weight: 700; width: 100%; text-align: left; white-space: nowrap;
}
.nav-link .icon { width: 17px; height: 17px; }
.nav-link:hover { background: #2a2a2a; color: var(--text-1); }
.nav-link[aria-current=page] { color: var(--accent); background: #303421; border-color: #454a30; }
.nav-end { display: grid; gap: 13px; margin-top: auto; }
.local-note { padding: 13px 10px 0; display: flex; align-items: center; gap: 8px; color: var(--quiet); font-size: 11px; border-top: 1px solid var(--hair); }
.local-note .icon { width: 13px; height: 13px; }
.workspace { min-width: 0; }
.topbar {
  min-height: 69px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 34px; border-bottom: 1px solid #303030; background: var(--canvas);
}
.breadcrumb { display: flex; align-items: center; gap: 10px; color: var(--quiet); font-size: 12px; min-width: 0; }
.breadcrumb span { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.breadcrumb strong { color: #e1e1e1; white-space: nowrap; }
.breadcrumb .icon { width: 12px; height: 12px; color: var(--quiet); }
.header-actions { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.header-actions .btn { padding: 8px 13px; min-height: 34px; font-size: 12px; }
.avatar {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid #555a3d;
  color: var(--accent); background: #333728; font-weight: 800; font-size: 12px; padding: 0;
}
.view { max-width: 1320px; margin: 0 auto; padding: 33px 34px 44px; }
.pagehead { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 24px; }
.pagehead p { margin-top: 9px; color: var(--muted); font-size: 14px; max-width: 650px; }
.eyebrow { text-transform: uppercase; letter-spacing: .13em; font-weight: 800; font-size: 10px; color: var(--muted); }
.eyebrow.accent { color: var(--accent); }
.pagehead .eyebrow { margin-bottom: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-pill);
  padding: 10px 16px; min-height: 40px; font-weight: 800; font-size: 13px; color: var(--text-1);
  border: 1px solid #494949; background: transparent; text-decoration: none; white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
}
.btn:hover { background: #353535; border-color: #616161; }
.btn.primary { color: var(--text-on-lime); background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: #303030; border-color: #303030; }
.btn.ghost:hover { background: var(--bg-4); }
.btn.small { padding: 7px 12px; min-height: 33px; font-size: 12px; }
.btn.icon-btn { width: 36px; min-height: 36px; padding: 0; }
.btn .icon, .text-button .icon { width: 15px; height: 15px; }
.text-button { background: none; color: var(--text-1); border: 0; display: inline-flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 13px; font-weight: 800; white-space: nowrap; }
.text-button:hover { color: var(--accent); }
.text-button.accent { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--card-radius); min-width: 0; }
.card.pad { padding: 22px; }
.hero {
  min-height: 218px; position: relative; display: flex; align-items: center; overflow: hidden; border-color: #414434;
  background: #282b21;
}
.hero-copy { position: relative; z-index: 2; padding: 24px 28px; max-width: 68%; }
.hero-copy .eyebrow { display: flex; align-items: center; gap: 8px; }
.hero-copy h2 { font-size: clamp(27px, 3.05vw, 45px); font-weight: 800; margin-top: 8px; line-height: 1.07; }
.hero-copy p { color: #c3c4b7; font-size: 13px; max-width: 450px; margin: 9px 0 15px; }
.hero-copy .btn { padding: 9px 16px; min-height: 39px; }
.hero-art { position: absolute; inset: 0 0 0 auto; width: 48%; isolation: isolate; overflow: hidden; display: grid; place-items: center; }
.hero-art::before { content: ''; position: absolute; inset: 0; z-index: -2; background: radial-gradient(ellipse at 60% 56%, #798c30 0, #465027 35%, #282b21 72%); }
.hero-art::after {
  content: ''; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(#bccd80 1px, transparent 1px);
  background-size: 9px 9px; opacity: .23; mask-image: radial-gradient(ellipse at 66% 54%, black, transparent 71%);
}
.hero-art img { width: clamp(118px, 15vw, 205px); height: auto; transform: rotate(-9deg) translate(17px, -2px); filter: drop-shadow(0 16px 18px #14180a99); }
.hero-ring { border: 1px solid #b0ba665c; width: 195px; height: 195px; position: absolute; border-radius: 50%; top: 50%; left: 56%; transform: translate(-50%, -50%); z-index: -1; }
.hero-ring + .hero-ring { width: 240px; height: 240px; border-color: #b0ba6633; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: 0 0 auto; }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; margin-top: 14px; }
.metric {
  padding: 14px 15px; text-align: left; color: var(--text-1); display: flex; align-items: center; gap: 12px;
  background: var(--card); transition: border-color var(--dur-fast), background var(--dur-fast);
}
.metric:hover { border-color: #606448; background: #292b22; }
.metric-icon, .section-icon { display: grid; place-items: center; color: var(--accent); background: #343825; border: 1px solid #43482f; border-radius: 11px; width: 38px; height: 38px; flex: 0 0 auto; }
.metric-text { display: grid; flex: 1; min-width: 0; }
.metric-text strong { font-size: 23px; line-height: 1.14; letter-spacing: -.055em; }
.metric-text small { font-size: 11px; color: var(--muted); margin-top: 3px; }
.metric > .icon { color: var(--quiet); width: 14px; height: 14px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 15px; margin-top: 22px; }
.dash-card { padding: 18px; }
.card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
.card-heading h2 { font-size: 19px; }
.card-heading p { margin-top: 4px; }
.tile-list { display: grid; gap: 2px; }
.tile {
  display: grid; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; text-align: left; gap: 10px;
  border: 0; background: transparent; border-bottom: 1px solid #373737; color: var(--text-1); padding: 8px 2px; width: 100%;
}
.tile:last-child { border-bottom: 0; }
.tile:hover { color: var(--accent); }
.tile .section-icon { width: 31px; height: 31px; border: 0; background: #2f3027; border-radius: 8px; }
.tile .section-icon .icon { width: 15px; height: 15px; }
.tile span:not(.section-icon) strong { display: block; font-size: 12px; }
.tile small { display: block; color: var(--muted); font-size: 10px; }
.tile .tile-status { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 10px; color: var(--muted); }
.tile-status .icon { width: 13px; height: 13px; color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.timeline li { position: relative; display: grid; grid-template-columns: 11px minmax(0,1fr); gap: 11px; align-items: start; }
.timeline li:not(:last-child)::after { position: absolute; content: ''; left: 4px; top: 14px; bottom: -9px; width: 1px; background: #454545; }
.timeline .point { width: 9px; height: 9px; border-radius: 50%; background: #666; margin-top: 8px; z-index: 1; }
.timeline .point.live { background: var(--accent); box-shadow: 0 0 0 3px #d7fc4e24; }
.timeline button { width: 100%; padding: 0; background: none; border: 0; text-align: left; color: var(--text-1); }
.timeline button:hover .timeline-title { color: var(--accent); }
.timeline-title { font-weight: 800; font-size: 13px; display: block; margin-top: 1px; }
.timeline small { color: var(--muted); font-size: 11px; }
.pace { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--hair); margin-top: 16px; padding-top: 13px; }
.pace strong { display: block; font-size: 18px; letter-spacing: -.04em; }
.pace small { color: var(--muted); font-size: 11px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; color: #bcbcbc; background: #313131; border: 1px solid #414141;
  border-radius: var(--r-pill); padding: 3px 8px; font-size: 10px; font-weight: 800; line-height: 1.45; white-space: nowrap;
}
.badge.lime { color: var(--accent); background: var(--accent-tint); border-color: #454b30; }
.badge.warn { color: #f5cb83; background: #3c3224; border-color: #59452b; }
.subdued { color: var(--muted); }
.quiet { color: var(--quiet); }
.small-copy { font-size: 12px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stack { display: grid; gap: 15px; }
.columns { display: grid; gap: 17px; grid-template-columns: minmax(0, 1fr) minmax(232px, .43fr); align-items: start; }
.form-layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 15px; align-items: start; }
.steps { padding: 12px; position: sticky; top: 16px; }
.step {
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted);
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 9px 7px; font-size: 12px; font-weight: 800;
}
.step .icon { width: 15px; height: 15px; }
.step span { flex: 1; }
.step small { color: var(--quiet); font-size: 10px; }
.step:hover { background: #2b2b2b; color: var(--text-1); }
.step[aria-current=step] { background: var(--accent-tint); border-color: #454a30; color: var(--accent); }
.step.done small { color: var(--accent); }
.progress { height: 5px; background: #393939; border-radius: 20px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--dur-base); }
.step-progress { padding: 6px 7px 13px; }
.step-progress .progress { margin-top: 8px; }
.fields { display: grid; gap: 13px; margin-top: 16px; }
.fields.compact { margin-top: 0; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; font-weight: 750; font-size: 12px; color: #e7e7e7; }
.field small, .field .hint { font-weight: 500; color: var(--muted); font-size: 11px; }
.field span sup { color: var(--accent); margin-left: 3px; }
.field input:not([type=checkbox]), .field textarea, .field select {
  width: 100%; min-width: 0; background: #2d2d2d; color: var(--text-1); border: 1px solid #454545; border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 13px; font-weight: 500; min-height: 41px; outline: 0;
}
.field textarea { resize: vertical; min-height: 74px; }
.field :is(input, textarea)::placeholder { color: #969696; opacity: 1; }
.field :is(input, textarea, select):focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field :is(input, textarea, select):disabled { opacity: .62; }
.checkbox { display: flex; align-items: start; gap: 7px; font-size: 12px; color: var(--muted); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex: 0 0 auto; }
.field-status { margin-top: 13px; padding-top: 14px; border-top: 1px solid var(--hair); }
.form-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px; margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--hair); }
.form-error { margin-top: 10px; color: #ffc2b9; font-size: 12px; }
.field.sprint-invalid { background: #462323; border-radius: var(--r-sm); box-shadow: 0 0 0 5px #462323; }
.field.sprint-invalid > span, .field .sprint-field-error { color: #ffb9b0; }
.field.sprint-invalid :is(input, textarea, select) { border-color: #ff8175; }
.field.sprint-invalid :is(input, textarea, select):focus { box-shadow: 0 0 0 3px #ff81753d; }
.field .sprint-field-error { font-weight: 750; }
.sprint-error { margin: 0 0 17px; padding: 11px 14px; background: #462323; border: 1px solid #a55751; border-radius: var(--r-sm); }
.callout { background: #2b2e23; color: #d6d9c7; border: 1px solid #444934; border-radius: 13px; padding: 12px; font-size: 12px; }
.callout p + p { margin-top: 7px; }
.callout ul { margin: 6px 0 0; padding-left: 17px; }
.callout strong { color: var(--text-1); }
.callout.warn { background: #372d21; color: #f3d6ad; border-color: #62482a; }
.trend-card { margin-top: 13px; padding: 15px; border: 1px solid var(--hair); border-radius: 13px; background: #252525; }
.trend-card .card-heading { margin-bottom: 10px; }
.proofs { display: grid; gap: 5px; padding: 10px 0 0; }
.proof-list { display: grid; gap: 6px; padding-top: 3px; }
.note-list { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
details summary { cursor: pointer; color: #d8d8d8; font-weight: 800; }
details[open] summary { margin-bottom: 10px; }
.empty { padding: 28px 22px; display: grid; justify-items: start; gap: 10px; }
.empty p { max-width: 620px; color: var(--muted); }
.report-summary {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center;
  padding: 24px 34px; background: radial-gradient(ellipse at 86% 45%, #383f24, #25271f 56%, #242424 80%);
  border-color: #464a34; margin-bottom: 14px;
}
.report-summary-copy { display: grid; gap: 10px; }
.report-summary-copy h2 { font-size: clamp(23px, 4vw, 37px); }
.report-summary-copy p { color: #d6d7cd; max-width: 570px; }
.report-summary-copy .flow { margin-top: 4px; }
.report-ring {
  width: clamp(125px, 19vw, 180px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%;
  background: conic-gradient(var(--accent) 0 var(--report-percent), #51563f var(--report-percent) 100%);
  box-shadow: 0 0 28px #d7fc4e12; padding: 8px;
}
.report-ring-value {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #26291f; border-radius: 50%; color: var(--accent);
}
.report-ring-value strong { font-size: clamp(37px, 6vw, 61px); letter-spacing: -.08em; line-height: 1; }
.report-ring-value strong span { font-size: .53em; margin-left: .12em; }
.report-ring-value small { color: #c2c8b4; font-size: 11px; margin-top: 4px; }
.report-jump { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.report-jump .dot { background: #858585; }
.report-jump .dot.supported { background: var(--accent); }
.report-tile, #report-priorities { scroll-margin-top: 14px; }
.reports-grid { display: grid; gap: 13px; grid-template-columns: repeat(2, minmax(0,1fr)); }
.report-tile { display: grid; gap: 8px; padding: 16px; align-content: start; }
.report-tile p { color: var(--muted); font-size: 12px; }
.score { font: 800 25px/1 var(--font-display); color: var(--accent); letter-spacing: -.045em; white-space: nowrap; flex: 0 0 auto; }
.score small { font-size: 11px; color: var(--muted); }
.recommend { display: grid; gap: 6px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.recommend:last-child { border: 0; }
.recommend .text-button { white-space: normal; text-align: left; }
.recommend p { font-size: 12px; color: var(--muted); }
.week-list { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; padding: 3px 3px 8px; overflow-x: auto; }
.week-list > button { flex: 0 0 auto; white-space: nowrap; }
.method-menu .flow { margin-top: 9px; }
.week-chip { border: 1px solid #444; border-radius: var(--r-pill); background: #242424; color: #bbb; padding: 7px 12px; font-size: 12px; font-weight: 750; }
.week-chip:hover { border-color: #747855; }
.week-chip[aria-current] { color: var(--accent); border-color: #636c37; background: var(--accent-tint); }
.attempt-nav { display: grid; gap: 8px; }
.attempt-nav button { background: #292929; color: #ddd; text-align: left; border: 1px solid #3f3f3f; border-radius: 10px; padding: 9px 10px; }
.attempt-nav button strong { display: block; }
.attempt-nav button[aria-current] { border-color: #626b3b; background: var(--accent-tint); color: var(--accent); }
.hadi-head { display: flex; align-items: center; gap: 9px; }
.hadi-letter { width: 29px; height: 29px; background: #383c2b; color: var(--accent); border-radius: 8px; display: grid; place-items: center; font-weight: 800; }
.hadi-part + .hadi-part { margin-top: 17px; padding-top: 15px; border-top: 1px solid var(--hair); }
.filters { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-bottom: 13px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; min-width: 635px; border-collapse: collapse; text-align: left; }
th { color: var(--muted); font-size: 11px; font-weight: 750; background: #282828; }
th, td { padding: 13px 14px; border-bottom: 1px solid #383838; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td { font-size: 12px; }
td .text-button { white-space: normal; text-align: left; }
.artifact-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.artifact { padding: 16px; display: grid; gap: 9px; align-content: start; }
.artifact h2 { font-size: 17px; overflow-wrap: anywhere; }
.artifact .btn { justify-self: start; }
.artifact p { color: var(--muted); font-size: 12px; }
dialog {
  width: min(560px, calc(100vw - 25px)); max-height: 88vh; color: var(--text-1); background: #252525; border: 1px solid #4b4b4b;
  border-radius: 19px; padding: 20px; box-shadow: var(--shadow-lg); overscroll-behavior: contain;
}
dialog::backdrop { background: #101010bb; backdrop-filter: blur(2px); }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 12px; }
.dialog-body { display: grid; gap: 11px; }
.dialog-body .fields { margin: 0; }
.project-list { display: grid; gap: 7px; }
.project-list button { width: 100%; text-align: left; }
.dialog-actions { display: flex; justify-content: end; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
.toast {
  position: fixed; bottom: 19px; right: 19px; z-index: 8; max-width: min(410px, calc(100vw - 38px)); color: var(--text-1);
  border: 1px solid #50583b; border-radius: 12px; padding: 12px 14px; background: #303527; box-shadow: var(--shadow-md);
}
.save-error { margin: 0 0 12px; }
#mobile-project { display: none; }

@media (min-width: 1500px) {
  :root { --sidebar: 240px; }
  .view { padding-inline: 42px; }
}
@media (max-width: 1050px) {
  :root { --sidebar: 199px; }
  .topbar, .view { padding-inline: 22px; }
  .form-layout { grid-template-columns: 176px minmax(0,1fr); }
  .artifact-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 840px) {
  :root { --sidebar: 63px; }
  #sidebar { padding: 13px 7px; gap: 15px; }
  .wordmark { padding: 0; justify-content: center; }
  .wordmark div, .nav-caption, .nav-link span, .project-picker .picker-name, .project-picker > .icon, .local-note span { display: none; }
  .project-picker { padding: 6px; justify-content: center; }
  .nav-link { justify-content: center; padding: 11px 5px; }
  .local-note { justify-content: center; padding-inline: 0; }
  .columns { grid-template-columns: minmax(0,1fr); }
  .columns > aside { grid-row: 1; }
  .form-layout .columns > aside { grid-row: auto; }
}
@media (max-width: 610px) {
  #shell { display: block; padding-bottom: 60px; }
  #sidebar {
    position: fixed; z-index: 5; top: auto; bottom: 0; height: auto; width: 100%; padding: 5px 5px max(5px, env(safe-area-inset-bottom));
    border-top: 1px solid #414141; border-right: 0; background: #1e1e1ef7; backdrop-filter: blur(6px);
  }
  #sidebar .wordmark, .project-picker, .nav-end { display: none; }
  .nav-group { grid-template-columns: repeat(6, minmax(0,1fr)); gap: 2px; }
  .nav-link { padding: 7px 0 5px; gap: 3px; flex-direction: column; }
  .nav-link span { display: block; font-size: 9px; line-height: 1.1; }
  .nav-link .icon { width: 16px; height: 16px; }
  #mobile-project { display: inline-flex; }
  #mobile-project img { width: 11px; height: 16px; object-fit: contain; }
  .topbar { min-height: 53px; padding-inline: 13px; }
  .breadcrumb { gap: 4px; }
  .breadcrumb > span:first-child, .breadcrumb > .icon:first-of-type { display: none; }
  .header-actions { gap: 6px; }
  .header-actions .btn { padding: 6px 9px; }
  .header-actions .btn .icon { width: 13px; }
  .view { padding: 19px 13px 25px; }
  .pagehead { align-items: start; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .pagehead p { font-size: 13px; margin-top: 6px; }
  h1 { font-size: 35px; }
  .hero { min-height: 198px; }
  .hero-copy { padding: 17px 14px; max-width: 76%; }
  .hero-copy h2 { font-size: clamp(25px, 6vw, 34px); }
  .hero-copy p { font-size: 12px; }
  .hero-art { width: 41%; opacity: .85; }
  .hero-art img { width: 98px; transform: rotate(-9deg) translate(11px, 0); }
  .metrics { gap: 5px; margin-top: 8px; }
  .metric { border-radius: 13px; align-items: start; flex-direction: column; gap: 6px; padding: 8px; }
  .metric-icon { width: 27px; height: 27px; border-radius: 7px; }
  .metric-icon .icon { width: 14px; height: 14px; }
  .metric-text strong { font-size: 20px; }
  .metric-text small { font-size: 10px; }
  .metric > .icon { display: none; }
  .dashboard-grid, .form-layout { grid-template-columns: minmax(0,1fr); gap: 10px; margin-top: 12px; }
  .steps { position: static; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); padding: 7px; }
  .step-progress { grid-column: 1/-1; padding-bottom: 6px; }
  .step { gap: 5px; font-size: 11px; padding: 6px 4px; }
  .step .icon { width: 13px; }
  .card.pad, .dash-card { padding: 14px; }
  .form-footer { margin-top: 12px; }
  .filters, .artifact-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .reports-grid { grid-template-columns: minmax(0,1fr); }
  .report-summary { gap: 12px; padding: 14px; }
  .report-summary-copy p { font-size: 12px; }
  .report-ring { width: 107px; padding: 6px; }
  .report-summary-copy .btn { white-space: normal; text-align: left; }
  .toast { bottom: 68px; }
}
@media (max-width: 355px) {
  .avatar { display: none; }
  .field-grid, .artifact-grid { grid-template-columns: minmax(0,1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

function dateKey(date) {
  return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
    .map((part, index) => index === 0 ? String(part) : String(part).padStart(2, '0')).join('-');
}
function addDays(value, days) {
  const date = new Date(value + 'T12:00:00');
  date.setDate(date.getDate() + days);
  return dateKey(date);
}
function monday(value = today()) {
  const date = new Date(value + 'T12:00:00');
  return addDays(value, -((date.getDay() + 6) % 7));
}
function weekRange(week) {
  const end = addDays(week, 6);
  if (week.slice(0, 7) === end.slice(0, 7)) return week.slice(-2).replace(/^0/, '') + '–' + ruDate(end, {day: 'numeric', month: 'long'});
  return ruDate(week) + ' – ' + ruDate(end);
}

  const center = (durations.length - 1) / 2;

    + '</strong><small>Недель закрыто в срок</small></div><div><strong>'
    + (median === null ? '—' : format.format(median) + ' дн.') + '</strong><small>Медиана до решения'

    + (filled / 7 * 100) + '%"></span></div></div>' + items.map(([key, label, glyph]) => {

function sectionHints(section, draft) {
  const data = draft.answers[section.id].fields;
  if (section.id === 'trends') return draft.trends.flatMap((trend, index) => trendHints(trend).map(text => 'Наблюдение ' + (index + 1) + '. ' + text));
  if (section.id === 'product' && fieldReady(data.effect) && !/\d/.test(data.effect)) return ['Добавьте измеримый эффект и базу сравнения.'];
  if (section.id === 'demand' && ['Контракт', 'Оплата'].includes(data.commitment) && !draft.answers.demand.artifacts.length) {
    return ['Приложите подтверждение контракта или оплаты.'];
  }
  if (section.id === 'market' && fieldReady(data.size) && !/\d/.test(data.size)) return ['Укажите число покупателей и цену за один период.'];

}
function hintPanel(section) {

      type: type === 'select' || type === 'number' ? type : 'textarea', placeholder: type === 'select' ? '' : placeholder,
      options: type === 'select' ? optionList(placeholder.split('|')) : [], hint, bind: 'answer', disabled,
    });
    body = '<div class="fields">' + fields.map(renderAnswer).join('') + '</div>';
    if (section.id === 'economy') {
      const finance = fields.filter(([key]) => ['cash', 'burn'].includes(key));

      body = '<div class="fields"><h3>Модель заработка и юнит-экономика</h3>' + model.map(renderAnswer).join('')
        + '<div class="field-status"><h3>Деньги компании и Runway</h3>'

        + '</div><div class="field-grid">' + finance.map(renderAnswer).join('') + '</div>'
        + '<div class="callout" id="runway">' + runwayCopy(answer.fields) + '</div></div>';
    }
    if (section.id === 'demand' && !fields.some(([key]) => key === 'retention')) {
      body += '<div class="callout" style="margin-top:12px">Удержание станет доступно после запуска продукта.</div>';
    }
    if (section.id === 'market') {
      body += '<div style="margin-top:12px">' + textButton('Открыть «Почему сейчас» в трендах', 'step:trends', 'up', true) + '</div>';

    + e(section.question) + '</p>' + body + statusField(answer) + linkedProofs(answer)
    + (answer.notes.length ? '<details open style="margin-top:12px"><summary>Результаты спринтов</summary><ul class="note-list">'
      + answer.notes.map(note => '<li>' + e(note.text) + '</li>').join('') + '</ul></details>' : '') + '</section>';

function runwayCopy(data) {
  if (!fieldReady(data.cash) || !fieldReady(data.burn)) return 'Запас средств появится после ввода остатка и расхода.';
  if (Number(data.burn) <= 0 || Number(data.cash) < 0) return 'Запас средств по этой формуле не рассчитывается.';
  return 'Runway · <strong>' + e(new Intl.NumberFormat('ru', {maximumFractionDigits: 1}).format(Number(data.cash) / Number(data.burn))) + ' мес.</strong>';
}

function diagnostics() {
  const p = project();
  const latest = reportCurrent(p);
  if (!latest) return pagehead('Диагностика') + empty('Отчёт ещё не готов', 'Отправьте анкету, чтобы получить первую оценку и выбрать приоритет для спринта.',
    button('Открыть анкету', 'go:application', 'primary', icon('right')));
  const report = p.reports.find(item => item.number === reportNumber) || latest;
  const base = p.reports[0];
  const strong = report.assessment.filter(row => row.score >= 3 && row.reliability !== 'Низкая').map(row => sectionBy(row.id).short);
  const todo = recommendations(report);
  const selector = field('Версия отчёта', 'report', report.number, {type: 'select', bind: 'report',
    options: [...p.reports].reverse().map(item => [item.number, 'Версия ' + item.number + ' · ' + ruDate(item.date)])});
  const ready = report.assessment.filter(item => item.progress.done === item.progress.total).length;
  const supported = report.assessment.filter(row => ['Средняя', 'Высокая'].includes(row.reliability)).length;
  const total = report.assessment.length;
  const percent = total ? Math.round(supported / total * 100) : 0;
  const headline = '<section class="card report-summary" aria-labelledby="report-overview">'
    + '<div class="report-summary-copy"><h2 id="report-overview">Подтверждённость проекта</h2>'
    + '<p>' + supported + ' из ' + total + ' разделов имеют подтверждения средней или высокой надёжности.</p>'
    + (strong.length ? '<p>Наиболее проработано: ' + e(strong.join(', ')) + '.</p>' : '')
    + '<div class="flow">' + button('К следующим проверкам', 'report-next', 'primary', icon('right'))
    + '<span class="subdued small-copy">Заполненность ' + ready + ' из ' + total + '</span></div></div>'
    + '<div class="report-ring" style="--report-percent:' + percent + '%" aria-label="Подтверждённость ' + percent + '%">'
    + '<div class="report-ring-value"><strong>' + percent + '<span>%</span></strong><small>из 100%</small></div></div></section>';
  const navigation = '<nav class="report-jump" aria-label="Разделы отчёта">' + report.assessment.map(row => {
    const section = sectionBy(row.id);
    const hasProof = ['Средняя', 'Высокая'].includes(row.reliability);
    return button('<span class="dot' + (hasProof ? ' supported' : '') + '"></span>' + e(section.short),
      'report-section:' + row.id, 'small');
  }).join('') + '</nav>';
  const priorities = '<div class="card pad" id="report-priorities" tabindex="-1"><div class="card-heading"><h2>Следующие проверки</h2></div>'
    + (todo.length ? todo.map(row => {
      const section = sectionBy(row.id);
      return '<div class="recommend"><strong>' + e(section.short) + '</strong><p>' + e(row.risk || section.next)
        + '</p><div class="flow">' + textButton('В спринт', 'recommend:' + row.id, 'right', true)
        + textButton('Уточнить ответ', 'step:' + row.id, 'edit') + '</div></div>';
    }).join('') : smallInfo('Выберите собственный приоритет для спринта.')) + '</div>';
  const cards = report.assessment.map(row => {
    const section = sectionBy(row.id);
    const prev = base.assessment.find(entry => entry.id === row.id);
    const sameSegment = base.draft.answers.problem.fields.segment === report.draft.answers.problem.fields.segment;
    const delta = report.number !== base.number && sameSegment && base.draft.info.stage === report.draft.info.stage
      && prev?.score !== null && row.score !== null ? row.score - prev.score : null;
    return '<article class="card report-tile" tabindex="-1" id="report-' + e(row.id) + '"><div class="card-heading"><h3>' + e(section.label) + '</h3><span class="score">'
      + (row.score === null ? '—' : row.score + ' <small>/ 4</small>') + '</span></div><div class="flow">'
      + badge('Подтверждение: ' + row.reliability.toLowerCase(), row.reliability === 'Высокая' ? 'lime' : '')
      + (delta === null ? '' : badge((delta > 0 ? '+' : '') + delta + ' к первой оценке')) + '</div><p>' + e(row.reason) + '</p>'
      + (row.risk ? '<p class="callout warn">' + e(row.risk) + '</p>' : '')
      + (row.artifacts.length ? '<div class="proof-list">' + row.artifacts.map(a =>
        textButton(e(a.name + ' · v' + a.version), 'artifact-version:' + a.id + ':' + a.version, 'up')).join('') + '</div>' : '')
      + textButton('Уточнить ответ', 'step:' + row.id, 'edit') + '</article>';
  }).join('');
  return pagehead('Диагностика проекта', 'Зрелость и надёжность подтверждений оцениваются отдельно.', selector)
    + (reportHasChanges(p) ? '<div class="callout" style="margin-bottom:14px">В анкете появились изменения. '
      + textButton('Получить новую оценку', 'submit-review', 'right', true) + '</div>' : '')
    + headline + navigation + '<div class="columns"><div class="reports-grid">' + cards + '</div>'
    + '<aside>' + priorities + '</aside></div>';
}

function editValue(input) {
  if (!input.dataset.bind) return;
  const [kind, key] = input.dataset.bind.split(':');
  const name = input.name;
  const value = input.value;
  const p = project();
  if (kind === 'report') {
    reportNumber = Number(value);
    render();
    $('[data-bind=report]')?.focus();
    return;
  }
  if (kind === 'filter') {
    filters[name] = value;
    render();
    $('[data-bind=filter][name="' + name + '"]')?.focus();
    return;
  }
  const answer = p.draft.answers[step];
  if (kind === 'info') {
    p.draft.info[name] = value;
    if (name === 'name') {
      const crumb = $('.crumb-name');
      if (crumb) crumb.textContent = projectName(p);
      const picker = $('.picker-name strong');
      if (picker) picker.textContent = projectName(p);
    }
  } else if (kind === 'answer' && answer) {
    answer.fields[name] = value;
    if (step === 'economy') $('#runway').innerHTML = runwayCopy(answer.fields);
  } else if (kind === 'answer-status' && answer) {
    answer.status = value;
    save();
    render();
    $('[data-bind=answer-status]')?.focus();
    return;
  } else if (kind === 'trend') {
    const trend = p.draft.trends.find(item => item.id === key);
    if (trend) trend[name] = value;
  } else if (kind === 'proof' && answer) {
    answer.artifacts = input.checked ? [...new Set([...answer.artifacts, name])] : answer.artifacts.filter(item => item !== name);
  } else if (kind === 'plan' || kind === 'result') {
    const attempt = attemptBy(key);
    if (!attempt || attempt.closed || kind === 'plan' && attempt.started) return;
    attempt[name] = value;
    if (name === 'type' && kind === 'plan') {
      save();
      render();
      $('[data-bind^=plan][name=type]')?.focus();
      return;
    }
    updateSprintValidation();
  }
  if (route === 'application') $('#form-steps').innerHTML = stepList();
  scheduleSave();
}

const fileLimit = 10 * 1024 * 1024;

function artifactFiles(mode, operation) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('startup-os:artifacts', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      const db = request.result;
      try {
        const tx = db.transaction('files', mode);
        const result = operation(tx.objectStore('files'));
        tx.oncomplete = () => { db.close(); resolve(result.result); };
        tx.onabort = () => { db.close(); reject(tx.error); };
      } catch (error) {
        db.close();
        reject(error);
      }
    };
  });
}
function normalizeArtifactUrl(value) {
  const input = clean(value);
  if (!input || /[\r\n\t]/.test(input)) return '';
  if (/^https?:\/\//i.test(input)) return safeUrl(input);
  if (input.startsWith('//')) return safeUrl('https:' + input);
  if (!/^[^/\s?#:@]+\.[^/\s?#:@]+(?=[/:?#]|$)/u.test(input)) return '';
  return safeUrl('https://' + input);
}

    link.download = file.name;

    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch {
    toast('Файл недоступен в этом браузере. Откройте ссылку или прикрепите файл повторно.');
  }
}
function blobAsBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function exportProject() {
  const source = project();
  if (!source) return;
  const copy = clone(source);
  const files = {};
  try {
    for (const artifact of copy.artifacts) {
      for (const version of [artifact, ...(artifact.history || [])]) {
        const file = version.file;
        if (!file) continue;
        if (file.data) {
          file.key = id();
          files[file.key] = file.data;
          delete file.data;
        } else if (!Object.hasOwn(files, file.key)) {
          const blob = await readArtifactFile(file.key, source.id);
          if (!blob) throw new Error('Не удалось прочитать вложение «' + file.name + '».');
          files[file.key] = await blobAsBase64(blob);
        }
      }
    }
    const payload = JSON.stringify({format: 'startup-os-project', version: 1, project: copy, files});
    const url = URL.createObjectURL(new Blob([payload], {type: 'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = projectName(source).replace(/[\\/:*?"<>|]/g, '_') + '.startup-os.json';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    if (dialog.open) dialog.close();
    toast('Проект выгружен вместе с вложениями');
  } catch (error) {
    toast(error.message || 'Не удалось выгрузить проект.');
  }
}
function chooseWeek(p) {
  const last = p.weeks.reduce((latest, week) => week.date > latest ? week.date : latest, '');
  return last && last >= monday() ? addDays(last, 7) : monday();
}
function weekDialog(initial = {}) {
  const p = project();
  const add = !initial.forceNew && Boolean(initial.title || initial.previous);
  const date = add && currentWeek(p) && !currentWeek(p).closed ? currentWeek(p).date : chooseWeek(p);
  const copy = add ? 'Выберите дату существующей открытой недели или начните новую.' : 'Дата будет приведена к понедельнику выбранной недели.';
  const body = '<div class="fields compact">' + field('Фокус недели', 'focus', initial.title || '', {required: true, placeholder: 'Какое решение поможет принять проверка?'})
    + field('Дата недели', 'date', date, {type: 'date', required: true})
    + field('Встреча или разбор', 'meeting', '', {type: 'datetime-local', hint: 'Необязательно'}) + '</div>' + smallInfo(copy);
  showDialog(add ? 'Добавить проверку в спринт' : 'Новый спринт', body, values => {
    const focus = clean(values.get('focus'));
    const start = monday(values.get('date'));
    if (!focus) return 'Укажите фокус недели.';
    let week = weekBy(start);
    if (week?.closed) return 'Эта неделя закрыта. Выберите другую.';
    if (week && !add) return 'Спринт на эту неделю уже есть. Выберите другую дату.';
    if (!week) {
      week = {date: start, focus, meeting: values.get('meeting'), closed: ''};
      p.weeks.push(week);
      p.weeks.sort((a, b) => a.date.localeCompare(b.date));
    }
    const {forceNew, ...plan} = initial;
    const check = newAttempt(start, {...plan, deadline: addDays(start, 6), title: initial.title || focus});
    p.attempts.push(check);
    save();
    dialog.close();
    go('sprints', {week: start, attempt: check.id});
  }, add ? 'Добавить проверку' : 'Создать спринт');
}
function planFieldErrors(attempt, week) {
  const messages = {
    type: 'Выберите тип гипотезы.',
    title: 'Введите название проверки.',
    hypothesis: 'Опишите, что предполагаете.',
    action: 'Опишите действие для проверки.',
    metric: 'Укажите, как измерите результат.',
    threshold: 'Укажите критерий подтверждения.',
    owner: 'Укажите ответственного.',
    method: 'Укажите метод проверки.',
    deadline: 'Укажите срок проверки.',
  };
  const errors = Object.fromEntries(Object.entries(messages).filter(([name]) => !fieldReady(attempt[name])));
  if (!errors.deadline && (attempt.deadline < week.date || attempt.deadline > addDays(week.date, 13))) {
    errors.deadline = 'Укажите срок в пределах двух недель от начала спринта.';
  }
  const metric = clean(attempt.metric).toLowerCase().replace(/\s+/g, ' ');
  if (metric && project().attempts.some(other => other.id !== attempt.id && other.started && !other.closed
    && other.weeks.includes(week.date) && clean(other.metric).toLowerCase().replace(/\s+/g, ' ') === metric)) {
    errors.metric = 'Эту метрику уже проверяет другая гипотеза недели. Выберите другой показатель или завершите ту проверку.';
  }
  return errors;
}
function needsResultEvidence(attempt) {
  return OUTCOMES.slice(0, 2).includes(attempt.outcome);
}
function resultFieldErrors(attempt) {
  const errors = {};
  if (!attempt.outcome) errors.outcome = 'Выберите исход проверки.';
  if (!attempt.decision) errors.decision = 'Выберите решение по итогам проверки.';
  if (!clean(attempt.insight)) errors.insight = 'Запишите вывод и объясните своё решение.';
  if (needsResultEvidence(attempt)) {
    if (!clean(attempt.data)) errors.data = 'Укажите фактический результат в поле «Что получили?».';
    if (!artifactBy(attempt.artifact)) errors.artifact = 'Выберите или добавьте подтверждающий артефакт.';
  }
  return errors;
}
function updateSprintValidation() {
  const banner = $('#sprint-error');
  if (!banner) return;
  const {week, attempt} = activeSprint();
  if (!attempt || week.closed || attempt.closed) return;
  const validation = sprintValidation?.id === attempt.id && sprintValidation.week === week.date ? sprintValidation : null;
  let errors = {};
  if (validation?.mode === 'plan') errors = planFieldErrors(attempt, week);
  if (validation?.mode === 'result') errors = resultFieldErrors(attempt);
  if (validation?.mode === 'continue' && !clean(attempt.data)) {
    errors.data = 'Запишите промежуточные данные, чтобы продолжить проверку на следующей неделе.';
  }
  for (const control of $('#view').querySelectorAll('[data-bind^="plan:"], [data-bind^="result:"]')) {
    if (control.disabled) continue;
    const label = control.closest('.field');
    if (control.dataset.bind.startsWith('result:')) {
      const required = ['outcome', 'decision', 'insight'].includes(control.name)
        || ['data', 'artifact'].includes(control.name) && needsResultEvidence(attempt);
      control.required = required;
      const caption = label.firstElementChild;
      if (required && !caption.querySelector('sup')) caption.insertAdjacentHTML('beforeend', '<sup>*</sup>');
      if (!required) caption.querySelector('sup')?.remove();
    }
    const message = errors[control.name];
    let hint = label.querySelector('.sprint-field-error');
    label.classList.toggle('sprint-invalid', Boolean(message));
    if (message) {
      if (!hint) {
        hint = document.createElement('small');
        hint.id = 'sprint-field-error-' + control.name;
        hint.className = 'sprint-field-error';
        hint.setAttribute('aria-hidden', 'true');
        label.append(hint);
      }
      hint.textContent = message;
      control.setAttribute('aria-invalid', 'true');
      control.setAttribute('aria-describedby', hint.id);
    } else {
      hint?.remove();
      control.removeAttribute('aria-invalid');
      control.removeAttribute('aria-describedby');
    }
  }
  const message = Object.keys(errors).length ? 'Проверьте поля, отмеченные красным.' : validation?.note || '';
  if (banner.textContent !== message) banner.textContent = message;
  banner.hidden = !message;
}
function showSprintValidation(attempt, week, mode, note = '') {
  sprintValidation = {id: attempt.id, week: week.date, mode, note};
  if (activeSprint().attempt?.id !== attempt.id) go('sprints', {week: week.date, attempt: attempt.id});
  updateSprintValidation();
  const target = $('#view [aria-invalid="true"]') || $('#sprint-error:not([hidden])');
  if (target) {
    (target.closest('.field') || target).scrollIntoView({block: 'center'});
    target.focus({preventScroll: true});
  }
}
function startAttempt(key) {
  const {week} = activeSprint();
  const attempt = attemptBy(key);
  if (!attempt || attempt.started || week?.closed) return;
  if (Object.keys(planFieldErrors(attempt, week)).length) return showSprintValidation(attempt, week, 'plan');
  sprintValidation = null;
  attempt.locked = planOf(attempt);
  attempt.started = new Date().toISOString();
  save();
  render();
  toast('Проверка запущена. Порог и срок сохранены.');
}
function revisePlan(key) {
  const attempt = attemptBy(key);
  const {week} = activeSprint();
  if (!attempt?.started || attempt.closed || week.closed) return;
  showDialog('Уточнить план проверки', '<div class="fields compact">'
    + field('Почему меняете план?', 'reason', '', {type: 'textarea', required: true})
    + field('Действие', 'action', attempt.action, {type: 'textarea', required: true})
    + field('Метод проверки', 'method', attempt.method, {required: true, hint: 'Укажите один способ или сочетание методов.'})
    + field('Основная метрика', 'metric', attempt.metric, {required: true})
    + field('Критерий подтверждения', 'threshold', attempt.threshold, {required: true})
    + field('Срок', 'deadline', attempt.deadline, {type: 'date', required: true}) + '</div>', values => {
    const reason = clean(values.get('reason'));
    if (!reason) return 'Укажите причину изменения.';
    const patch = Object.fromEntries(['action', 'method', 'metric', 'threshold', 'deadline'].map(name => [name, clean(values.get(name))]));
    const [issue] = Object.values(planFieldErrors({...attempt, ...patch}, week));
    if (issue) return issue;
    attempt.revisions.push({reason, date: new Date().toISOString(), plan: planOf(attempt)});
    Object.assign(attempt, patch);
    save();
    dialog.close();
    render();
  }, 'Сохранить версию плана');
}
function closeAttempt(key) {
  const attempt = attemptBy(key);
  if (!attempt || !attempt.started || attempt.closed) return;
  const {week} = activeSprint();
  if (Object.keys(resultFieldErrors(attempt)).length) return showSprintValidation(attempt, week, 'result');
  sprintValidation = null;
  attempt.closed = new Date().toISOString();
  save();
  render();
  toast('Вывод сохранён в банке гипотез');
}
function closeWeek() {
  const p = project();
  const {week, attempts} = activeSprint();
  if (!week || week.closed) return;
  if (!attempts.length) return toast('Добавьте проверку к этому спринту.');
  const unfinished = attempts.filter(attempt => !attempt.closed);
  const next = addDays(week.date, 7);
  const canContinue = attempt => attempt.started && attempt.weeks.length === 1
    && attempt.deadline >= next && !weekBy(next)?.closed;
  const blocked = unfinished.find(attempt => !canContinue(attempt) || !clean(attempt.data));
  if (blocked) {
    if (!blocked.started) return showSprintValidation(blocked, week, 'plan', 'Запустите проверку и сохраните вывод перед закрытием недели.');
    if (canContinue(blocked)) return showSprintValidation(blocked, week, 'continue', 'Теперь можно закрыть неделю и продолжить проверку.');
    return showSprintValidation(blocked, week, 'result', 'Сохраните вывод этой проверки, затем закройте неделю.');
  }
  const finish = () => {
    week.closed = new Date().toISOString();
    week.attemptSnapshots = clone(attempts);
    if (unfinished.length) {
      if (!weekBy(next)) {
        p.weeks.push({date: next, focus: week.focus, closed: '', meeting: ''});
        p.weeks.sort((a, b) => a.date.localeCompare(b.date));
      }
      for (const attempt of unfinished) attempt.weeks.push(next);
    }
    save();
    dialog.close();
    go('sprints', {week: unfinished.length ? next : week.date});
    toast(unfinished.length ? 'Неделя закрыта. Проверка продолжается в следующем спринте.' : 'Неделя закрыта');
  };
  showDialog('Закрыть неделю?', smallInfo(unfinished.length
    ? 'Незавершённые двухнедельные проверки продолжатся в следующем спринте.' : 'Итоги недели сохранятся в истории проекта.'),
  finish, 'Закрыть неделю');
}
function reassess(key) {
  const attempt = attemptBy(key);
  const answer = project().draft.answers[attempt?.section];
  if (!attempt?.closed || !answer) return;
  if (!answer.notes.some(note => note.attempt === key)) {
    answer.notes.push({attempt: key, text: attempt.title + '. ' + attempt.data + ' ' + attempt.insight,
      artifact: attempt.artifact, repeated: !!attempt.previous && attempt.outcome === 'Подтверждена'
        && attemptBy(attempt.previous)?.outcome === 'Подтверждена'});
    if (artifactBy(attempt.artifact)) answer.artifacts = [...new Set([...answer.artifacts, attempt.artifact])];
    answer.status = '';
    save();
  }
  go('application', {step: attempt.section});
  toast('Результат добавлен к разделу. Можно отправить анкету повторно.');
}
function openAttempt(key) {
  const attempt = attemptBy(key);
  if (attempt) go('sprints', {week: attempt.weeks.at(-1), attempt: key});
}
function openHelp() {
  showDialog('Кабинет основателя', '<p>Заполните анкету, получите входную диагностику и запланируйте проверку на неделю.</p>'
    + '<div class="callout"><strong>Тестовая версия</strong><p>Проекты, черновики и файлы хранятся только в вашем браузере.</p></div>'
    + '<a href="https://product-growth.ru/blog/8g1ici9kj1-hadi-tsikli-kak-proveryat-gipotezi-i-pre" target="_blank" rel="noopener noreferrer">Как работать с HADI ' + icon('up') + '</a>');
}

function focusReport(id) {
  const section = document.getElementById(id);
  section?.scrollIntoView({block: 'start'});
  section?.focus({preventScroll: true});
}
const actions = {
  'report-next': () => focusReport('report-priorities'),
  'report-section': key => focusReport('report-' + key),
  go: view => go(view),
  step: key => { if (dialog.open) dialog.close(); go('application', {step: key}); },
  'new-project': () => {
    if (sharedMode) return window.startupWorkspace.newProject();
    const p = createProject();
    state.projects.push(p);
    activate(p, 'application');
  },
  project: key => {
    if (sharedMode) return window.startupWorkspace.openProject(key, 'home');
    const p = state.projects.find(item => item.id === key);
    if (p) activate(p, 'home');
  },
  projects: () => sharedMode ? window.startupWorkspace.projectPicker() : showProjects(),
  'export-project': exportProject,
  help: openHelp,
  'close-dialog': () => dialog.close(),
  'retry-save': () => { if (save()) toast('Данные сохранены'); },
  'add-trend': () => {
    const trend = emptyTrend();
    project().draft.trends.push(trend);
    save();
    render();
    $('[data-bind="trend:' + trend.id + '"]')?.focus();
  },
  'remove-trend': deleteTrend,
  'check-answer': showHints,
  'submit-review': reviewApplication,
  'new-artifact': attach => artifactDialog(null, attach),
  'edit-artifact': key => artifactDialog(artifactBy(key)),
  download: downloadArtifact,
  'artifact-version': artifactVersion,
  'new-week': () => weekDialog(),
  week: key => go('sprints', {week: key, attempt: ''}),
  attempt: key => { selectedAttempt = key; render(); },
  'bank-attempt': openAttempt,
  'add-attempt': () => {
    const {week} = activeSprint();
    if (!week || week.closed) return;
    const attempt = newAttempt(week.date);
    project().attempts.push(attempt);
    selectedAttempt = attempt.id;
    save();
    render();
    $('[data-bind^=plan][name=type]')?.focus();
  },
  recommend: key => {
    const section = sectionBy(key);
    if (section) weekDialog({section: key, title: section.next});
  },
  repeat: key => {
    const attempt = attemptBy(key);
    if (!attempt?.closed) return;
    weekDialog({...planOf(attempt), previous: attempt.id});
  },
  method: value => {
    const [key, index] = value.split(':');
    const attempt = attemptBy(key);
    const input = $('#view [name="method"]');
    if (!input || !attempt || attempt.started || input.dataset.bind !== 'plan:' + key) return;
    const suggested = hypothesisBy(attempt.type)?.[6] || [];
    const choice = [...new Set([...suggested, ...COMMON_METHODS])][Number(index)];
    if (!choice) return;
    const methods = input.value.split(';').map(clean).filter(Boolean);
    if (!methods.includes(choice)) {
      input.value = [...methods, choice].join('; ');
      editValue(input);
    }
  },
  revise: revisePlan,
  'start-attempt': startAttempt,
  'close-attempt': closeAttempt,
  'close-week': closeWeek,
  reassess,
};
document.addEventListener('click', event => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  event.preventDefault();
  const [action, ...parts] = target.dataset.act.split(':');
  if (sharedMode && window.startupWorkspace?.action(action, parts.join(':'))) return;
  actions[action]?.(parts.join(':'));
});
window.addEventListener('hashchange', () => {
  const next = location.hash.slice(1);
  if (NAV.some(item => item[0] === next) && route !== next) go(next);
});
const initialRoute = location.hash.slice(1);
if (NAV.some(item => item[0] === initialRoute)) route = initialRoute;
if (!sharedMode) {
  document.title = 'Startup OS';
  render();
}
